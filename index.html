<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Academic Planner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232d5fa8'/%3E%3Crect x='10' y='12' width='20' height='12' rx='2' fill='%23daf2c6'/%3E%3Crect x='34' y='12' width='20' height='12' rx='2' fill='%23fff'/%3E%3Crect x='10' y='28' width='20' height='12' rx='2' fill='%23fff'/%3E%3Crect x='34' y='28' width='20' height='12' rx='2' fill='%23f4a3a3'/%3E%3Crect x='10' y='44' width='44' height='8' rx='2' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{--bg:#f4f6fa;--panel:#fff;--ink:#1b2230;--mut:#667085;--line:#d6dbe4;--acc:#2d5fa8;--accfg:#fff;--inp:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161d;--panel:#1b212b;--ink:#e8ecf2;--mut:#98a2b3;--line:#2f3846;--acc:#6ea3f0;--accfg:#0d1522;--inp:#232b37}}
:root[data-theme="dark"]{--bg:#12161d;--panel:#1b212b;--ink:#e8ecf2;--mut:#98a2b3;--line:#2f3846;--acc:#6ea3f0;--accfg:#0d1522;--inp:#232b37}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;gap:8px;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header b{flex:1;font-size:18px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--inp);color:var(--ink);border-radius:8px;padding:6px 11px}
button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{max-width:760px;margin:0 auto;padding:40px 16px 56px}
h1{font-size:28px;line-height:1.2;margin:0 0 8px}
.lead{color:var(--mut);margin:0 0 32px;max-width:60ch}
.tool{display:flex;gap:16px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.tool svg{flex:none;width:56px;height:56px;border-radius:12px}
.tool h2{font-size:18px;margin:0 0 4px}
.tool h2 a{color:var(--ink);text-decoration:none}
.tool h2 a::after{content:"";position:absolute;inset:0}
.tool{position:relative}
.tool:hover{border-color:var(--acc)}
.tool p{margin:0 0 10px;color:var(--mut)}
.ex{position:relative;z-index:1;font-size:13px;color:var(--mut)}
.ex a{color:var(--acc)}
footer{margin-top:28px;font-size:13px;color:var(--mut)}
</style>
</head>
<body>
<header><b>Academic Planner</b><button id="lg" title="Language / Idioma">EN</button><button id="th">🌓</button></header>
<main>
<h1 data-i="h1"></h1>
<p class="lead" data-i="lead"></p>

<section class="tool">
<svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#2d5fa8"/><rect x="10" y="12" width="20" height="12" rx="2" fill="#daf2c6"/><rect x="34" y="12" width="20" height="12" rx="2" fill="#c2ede4"/><rect x="10" y="28" width="20" height="12" rx="2" fill="#c8d9f8"/><rect x="34" y="28" width="20" height="12" rx="2" fill="#fff6b3"/><rect x="10" y="44" width="20" height="8" rx="2" fill="#fff"/></svg>
<div>
<h2><a href="curriculum/" data-i="c_t"></a></h2>
<p data-i="c_d"></p>
<div class="ex"><span data-i="ex"></span> <a href="curriculum/examples/ads-2019-2021.json" download>ADS</a>, <a href="curriculum/examples/data-science-2024-present.json" download>Data Science</a></div>
</div>
</section>

<section class="tool">
<svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#2d5fa8"/><rect x="12" y="14" width="40" height="9" rx="2" fill="#fff"/><rect x="12" y="27" width="18" height="9" rx="2" fill="#fff"/><rect x="34" y="27" width="18" height="9" rx="2" fill="#f4a3a3"/><rect x="12" y="40" width="28" height="9" rx="2" fill="#fff"/><rect x="44" y="40" width="8" height="9" rx="2" fill="#fff"/></svg>
<div>
<h2><a href="schedule/" data-i="s_t"></a></h2>
<p data-i="s_d"></p>
<div class="ex"><span data-i="ex"></span> <a href="schedule/examples/schedule-2026-2.json" download>2026/2</a></div>
</div>
</section>

<footer data-i="foot"></footer>
</main>
<script>
const $=s=>document.querySelector(s);
const T={
en:{h1:"Academic Planner",lead:"Two small browser tools for organizing a degree: what you still have to take, and when and where your classes happen.",
c_t:"Curriculum grid",c_d:"Track every course by cycle with its status (completed, waived, proficiency, in progress, pending) and see overall progress. Export as JSON, PDF or PNG.",
s_t:"Class schedule",s_d:"Build a weekly timetable with subject, professor, room and cycle, plus extracurricular and tutoring slots. Export as JSON, PDF, PNG or DOCX.",
ex:"Example data:",foot:"Everything runs in your browser and is saved locally; nothing is sent to a server. The tools' interface is in Brazilian Portuguese."},
pt:{h1:"Planejador Acadêmico",lead:"Duas ferramentas leves, direto no navegador, para organizar a graduação: o que ainda falta cursar e quando e onde acontecem as aulas.",
c_t:"Grade curricular",c_d:"Acompanhe cada disciplina por ciclo com seu status (cursada, dispensada, proficiência, cursando, pendente) e veja o progresso geral. Exporte em JSON, PDF ou PNG.",
s_t:"Grade de aulas",s_d:"Monte a grade semanal com disciplina, professor, sala e ciclo, incluindo aulas extracurriculares e monitorias. Exporte em JSON, PDF, PNG ou DOCX.",
ex:"Dados de exemplo:",foot:"Tudo roda no seu navegador e fica salvo localmente; nada é enviado a servidor. A interface das ferramentas está em português do Brasil."}
};
let lg=(navigator.language||'en').toLowerCase().startsWith('pt')?'pt':'en';
try{lg=localStorage.getItem('glang')||lg}catch(e){}
const setLang=l=>{lg=T[l]?l:'en';document.documentElement.lang=lg==='pt'?'pt-BR':'en';
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=T[lg][e.dataset.i]);
 document.title=T[lg].h1;$('#lg').textContent=lg==='pt'?'PT':'EN';
 try{localStorage.setItem('glang',lg)}catch(e){}};
$('#lg').onclick=()=>setLang(lg==='en'?'pt':'en');setLang(lg);
// theme: same key and values as the tools, so the choice carries over
const TM=['auto','light','dark'],TL={auto:'🌓',light:'☀️',dark:'🌙'};
let tm='auto';try{tm=localStorage.getItem('gtheme')||'auto'}catch(e){}
const setTheme=m=>{tm=TM.includes(m)?m:'auto';const r=document.documentElement;if(tm==='auto')delete r.dataset.theme;else r.dataset.theme=tm;
 $('#th').textContent=TL[tm];$('#th').title='Theme / Tema: '+tm;try{localStorage.setItem('gtheme',tm)}catch(e){}};
$('#th').onclick=()=>setTheme(TM[(TM.indexOf(tm)+1)%TM.length]);setTheme(tm);
</script>
</body>
</html>
