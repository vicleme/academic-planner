<style>

:root[data-theme="dark"]{--bg:#12161d;--panel:#1b212b;--ink:#e8ecf2;--mut:#98a2b3;--line:#2f3846;--acc:#6ea3f0;--accfg:#0d1522;--inp:#232b37;
--c-disc:#f2f2f2;--c-prof:#7db2ff;--c-sala:#ff9a85;--c-ciclo:#7fd48c;--g-head:#26405f;--g-cell:#1e2530;--g-line:#8a94a3;--g-extra:#5a2a31;--g-mon:#5c4d10;--g-empty:#161b23}

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1}
main{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:16px;padding:16px;align-items:start}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.card h2{font-size:14px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}

input,select,textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--inp);color:var(--ink);font:inherit}
input[type=checkbox]{width:auto}

.rz{position:absolute;top:0;bottom:0;width:12px;cursor:ew-resize;touch-action:none}
.rz.l{left:0}.rz.r{right:0}
.rz::after{content:"";position:absolute;top:25%;bottom:25%;left:4px;width:4px;border-radius:2px;background:var(--acc);opacity:0}
td.blk:hover .rz::after{opacity:.75}

td.b{border:none;background:var(--g-empty)}

summary{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}
summary::before{content:"▸";color:var(--mut);transition:transform .15s}details[open]>summary::before{transform:rotate(90deg)}
details[open]>summary{margin-bottom:10px}

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DEF={titulo:"Grade de aulas",dias:["Segunda-feira","Terça-feira","Quarta-feira","Quinta-feira","Sexta-feira"],
horarios:[{inicio:"07:40",fim:"09:20"},{inicio:"09:30",fim:"11:10"},{inicio:"11:20",fim:"13:00"},{inicio:"13:30",fim:"15:30"}],aulas:[]};
let S=JSON.parse(JSON.stringify(DEF));
try{const t=localStorage.getItem('grade');if(t)S=JSON.parse(t)}catch(e){}
const openSet=new Set();
let pres=null,undo=[],redo=[],lastT=0; // histórico: edições em sequência rápida (digitação) valem um passo só
const updH=()=>{const u=$('#undo'),r=$('#redo');if(u)u.disabled=!undo.length;if(r)r.disabled=!redo.length};
const save=()=>{const cur=JSON.stringify(S);try{localStorage.setItem('grade',cur)}catch(e){}
 if(pres===null){pres=cur;return}
 if(cur===pres)return;
 const n=Date.now();if(!undo.length||n-lastT>600){undo.push(pres);if(undo.length>100)undo.shift()}
 lastT=n;pres=cur;redo=[];updH()};
const msg=t=>$('#msg').textContent=t||'';
let ORD='insercao';try{ORD=localStorage.getItem('gradeOrd')||'insercao'}catch(e){}
function ordem(){const idx=S.aulas.map((a,i)=>i);
 if(ORD==='alfa')return idx.sort((x,y)=>(S.aulas[x].disciplina||'').localeCompare(S.aulas[y].disciplina||'','pt',{sensitivity:'base'})||x-y);
 if(ORD==='tempo')return idx.sort((x,y)=>{const a=S.aulas[x],b=S.aulas[y];return a.dia-b.dia||a.de-b.de||a.ate-b.ate||(a.monitoria?1:0)-(b.monitoria?1:0)||x-y});
 return idx.reverse()} // inserção: mais recentes primeiro
// mantém os horários em ordem cronológica e acompanha as aulas (de/ate) para que continuem no mesmo horário
function ordenaHorarios(){const H=S.horarios,idx=H.map((h,i)=>i);
 idx.sort((a,b)=>String(H[a].inicio).localeCompare(String(H[b].inicio))||String(H[a].fim).localeCompare(String(H[b].fim))||a-b);
 if(idx.every((v,i)=>v===i))return false;
 const map=[];idx.forEach((old,nw)=>map[old]=nw);
 S.horarios=idx.map(i=>H[i]);
 S.aulas.forEach(a=>{let d=map[a.de]??a.de,t=map[a.ate]??a.ate;if(t<d)[d,t]=[t,d];a.de=d;a.ate=t});
 return true}
const ovl=(a,b)=>{const H=S.horarios;return String(H[a].inicio)<String(H[b].fim)&&String(H[b].inicio)<String(H[a].fim)};
// linhas do cabeçalho: horários que se sobrepõem ficam em linhas diferentes; a linha preferida (campo l) é respeitada quando possível
function hlanes(){const H=S.horarios,ln=[],cnt=[];let n=1;
 colmap().comps.forEach(cp=>{
  if(cp.length===1){ln[cp[0]]=0;cnt[cp[0]]=1;return}
  const key=i=>Number.isInteger(H[i].l)&&H[i].l>=0?H[i].l:1000+i;
  const ord=cp.slice().sort((a,b)=>key(a)-key(b)||a-b),placed=[];
  ord.forEach(i=>{let l=Number.isInteger(H[i].l)&&H[i].l>=0?H[i].l:0;
   while(placed.some(o=>o.l===l&&ovl(o.i,i)))l++;placed.push({i,l})});
  const used=[...new Set(placed.map(o=>o.l))].sort((a,b)=>a-b); // compacta, sem linhas vazias
  placed.forEach(o=>{ln[o.i]=used.indexOf(o.l);cnt[o.i]=used.length});
  n=Math.max(n,used.length)});
 return {ln,n,cnt}}
// escolhe a linha de um horário; quem ocupava essa linha (e se sobrepõe) troca de lugar com ele
function setLane(i,t){const H=S.horarios,HL=hlanes(),cp=colmap().comps.find(c=>c.includes(i));if(!cp)return;
 const antes=HL.cnt[i],old=HL.ln[i],sw=cp.filter(j=>j!==i&&HL.ln[j]===t&&ovl(i,j));
 cp.forEach(x=>H[x].l=HL.ln[x]);sw.forEach(j=>H[j].l=old);H[i].l=t;
 if(hlanes().cnt[i]>antes)cp.forEach(x=>{if(x!==i&&!sw.includes(x))delete H[x].l})} // se criou linha a mais, os demais se reacomodam sozinhos
const somaMin=(t,m)=>{const [h,mi]=t.split(':').map(Number),v=Math.min(h*60+mi+m,1439);return String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0')};

// malha de colunas: horários que se sobrepõem compartilham colunas, delimitadas pelos instantes de início/fim do grupo;
// assim, horários que terminam juntos terminam na mesma coluna. Horários sem sobreposição ocupam uma coluna cada.
function colmap(){const H=S.horarios,c0=[],c1=[],comps=[];let cur=null,maxEnd='';
 H.forEach((h,i)=>{const a=String(h.inicio),b=String(h.fim);
  if(cur&&a<maxEnd){cur.push(i);if(b>maxEnd)maxEnd=b}else{cur=[i];comps.push(cur);maxEnd=b}});
 let col=0;
 comps.forEach(cp=>{
  if(cp.length===1){c0[cp[0]]=c1[cp[0]]=col++;return}
  const bs=[...new Set(cp.flatMap(i=>[String(H[i].inicio),String(H[i].fim)]))].sort(),nseg=Math.max(1,bs.length-1);
  cp.forEach(i=>{const a=bs.indexOf(String(H[i].inicio)),b=bs.indexOf(String(H[i].fim));c0[i]=col+a;c1[i]=col+Math.min(nseg-1,Math.max(a,b-1))});
  col+=nseg});
 return {C:Math.max(1,col),c0,c1,comps}}
// cabeçalho: uma linha por faixa de sobreposição; células vazias têm a mesma cor e se mesclam onde não há dois horários
function hdr(){const cm=colmap(),HL=hlanes(),n=HL.n,C=cm.C,H=S.horarios;
 const g=Array.from({length:n},()=>Array(C).fill(null)),colL=Array(C).fill(1);
 cm.comps.forEach(cp=>{const L=Math.max(...cp.map(i=>HL.ln[i]))+1;cp.forEach(i=>{for(let c=cm.c0[i];c<=cm.c1[i];c++)colL[c]=L})});
 const put=(l,c,sp,rs,i)=>{g[l][c]={i,span:sp,rs};for(let x=c+1;x<c+sp;x++)g[l][x]='s';
  for(let k=1;k<rs;k++){g[l+k][c]={cont:1,span:sp};for(let x=c+1;x<c+sp;x++)g[l+k][x]='s'}};
 H.forEach((h,i)=>{const l=HL.ln[i],L=colL[cm.c0[i]];put(l,cm.c0[i],cm.c1[i]-cm.c0[i]+1,l===L-1?n-l:1,i)});
 for(let l=0;l<n;l++)for(let c=0;c<C;){if(g[l][c]){c++;continue}
  const L=colL[c];let e=c;while(e+1<C&&!g[l][e+1]&&colL[e+1]===L)e++;
  put(l,c,e-c+1,l===L-1?n-l:1,-1);c=e+1}
 return {g,n,C}}
function layout(){ // cada dia pode ter várias faixas; Monitoria vai para outra faixa se sobrepuser
 const N=S.horarios.length,cm=colmap(),C=cm.C;
 return S.dias.map((d,di)=>{
  const as=S.aulas.filter(a=>a.dia===di).map(a=>{const de=Math.min(a.de,N-1),to=Math.min(Math.max(a.ate,de),N-1);let cs=1e9,ce=-1;
   for(let k=de;k<=to;k++){cs=Math.min(cs,cm.c0[k]);ce=Math.max(ce,cm.c1[k])}return {a,cs,ce}})
   .sort((x,y)=>(x.a.monitoria?1:0)-(y.a.monitoria?1:0)||x.cs-y.cs);
  const lanes=[];
  for(const it of as){let L=lanes.find(l=>l.every(o=>it.cs>o.ce||it.ce<o.cs));if(!L){L=[];lanes.push(L)}L.push(it)}
  if(!lanes.length)lanes.push([]);
  // célula vazia cobrindo [c, r1], ajustada a um horário
  const tile=(c,r1)=>{const cand=[];for(let k=0;k<N;k++)if(cm.c0[k]<=c&&c<=cm.c1[k])cand.push(k);
   const fit=cand.filter(k=>cm.c0[k]===c&&cm.c1[k]<=r1).sort((x,y)=>cm.c1[y]-cm.c1[x]);
   const k=fit.length?fit[0]:(cand.sort((x,y)=>(cm.c1[x]-cm.c0[x])-(cm.c1[y]-cm.c0[y]))[0]??0);
   const e=Math.min(cm.c1[k]??c,r1);return {a:null,span:Math.max(1,e-c+1),at:k}};
  // mescla na vertical (rowspan) o que não tem sobreposição com nada nas outras linhas do dia
  const LN=lanes.length,items=lanes.flat(),laneOf=new Map();lanes.forEach((L,li)=>L.forEach(it=>laneOf.set(it,li)));
  items.forEach(it=>it.m=!items.some(o=>laneOf.get(o)!==laneOf.get(it)&&o.cs<=it.ce&&o.ce>=it.cs));
  const occ=Array(C).fill(false),cov=Array(C).fill(false);
  items.forEach(it=>{for(let c=it.cs;c<=it.ce;c++){occ[c]=true;if(it.m)cov[c]=true}});
  const merged=[]; // células da 1ª linha que se estendem pelas demais: {c, span}
  return {d,rows:lanes.map((L,li)=>{const cells=[];let c=0;
   while(c<C){
    if(li===0){const mm=items.find(it=>it.m&&it.cs===c);
     if(mm){cells.push({a:mm.a,span:mm.ce-c+1,rs:LN});merged.push({c,span:mm.ce-c+1});c=mm.ce+1;continue}
     if(!occ[c]){let e=c;while(e+1<C&&!occ[e+1])e++;const t=tile(c,e);t.rs=LN;cells.push(t);merged.push({c,span:t.span});c+=t.span;continue}}
    else{const mc=merged.find(x=>x.c===c);if(mc){cells.push({cont:1,span:mc.span});c+=mc.span;continue}}
    const it=L.find(x=>x.cs===c);
    if(it){cells.push({a:it.a,span:it.ce-c+1});c=it.ce+1;continue}
    let e=c;while(e+1<C&&occ[e+1]&&!cov[e+1]&&!L.some(x=>x.cs<=e+1&&e+1<=x.ce))e++; // vazio numa zona de conflito
    const t=tile(c,e);cells.push(t);c+=t.span}
   return cells})}});
}
function lines(a){const L=[[a.disciplina,'d'],[a.professor,'p'],[a.sala,'s']];
 const c=[a.ciclo,a.monitoria?'(Monitoria)':'',a.extracurricular?'(Extracurricular)':''].filter(Boolean).join(' ');L.push([c,'c']);return L.filter(x=>x[0])}
function renderGrid(){
 const F=[['disciplina','d','Disciplina'],['professor','p','Professor'],['sala','s','Sala'],['ciclo','c','Ciclo']];
 const HD=hdr();let h='<table>'; // horários que se sobrepõem vão para outra linha do cabeçalho
 for(let li=0;li<HD.n;li++)h+='<tr>'+(li?'':`<th${HD.n>1?` rowspan="${HD.n}"`:''}></th>`)+HD.g[li].filter(x=>x&&x!=='s'&&!x.cont).map(x=>{
